name: Sync fork from upstream

on:
  schedule:
    # Runs daily; GitHub may delay this by a few minutes under load.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository != 'pollen-robotics/microduck_rl'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Merge upstream/develop into fork
        run: |
          git remote add upstream "https://github.com/pollen-robotics/microduck_rl.git"
          git fetch upstream develop
          git -c user.name="fork-sync-bot" -c user.email="actions@users.noreply.github.com" \
            merge --no-edit -m "Merge upstream/develop into fork (scheduled sync)" upstream/develop
          git push origin "HEAD:develop"
